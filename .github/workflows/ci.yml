name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_CONFIG: '{"apiKey":"ci","authDomain":"ci.firebaseapp.com","projectId":"ci","appId":"1:0:web:0"}'
          NEXT_PUBLIC_USE_EMULATOR: "false"

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy scripts app
      - run: pytest tests --ignore=tests/integration
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --project demo-pew-test --only firestore,auth "pytest tests/integration -v"

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true # non-blocking for now — devspec Phase 6 lands this as advisory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install api deps
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Start emulators
        run: firebase emulators:start --project demo-pew-test --only firestore,auth &
      - name: Wait for emulators
        run: npx wait-on tcp:8080 tcp:9099
      - name: Seed emulator data
        working-directory: api
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_PROJECT_ID: demo-pew-test
        run: python -c "import asyncio; from scripts.seed import run; asyncio.run(run(force=True))"
      - name: Start api (FakeLLMProvider)
        working-directory: api
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_PROJECT_ID: demo-pew-test
          USE_FAKE_LLM: "true"
        run: uvicorn app.main:app --port 8000 &
      - name: Wait for api
        run: npx wait-on tcp:8000
      - name: Start web
        working-directory: web
        env:
          NEXT_PUBLIC_USE_EMULATOR: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_FIREBASE_CONFIG: '{"apiKey":"demo","authDomain":"demo-pew-test.firebaseapp.com","projectId":"demo-pew-test","appId":"1:0:web:0"}'
        run: npm run dev &
      - name: Wait for web
        run: npx wait-on http://localhost:3000
      - name: Run Playwright e2e
        working-directory: web
        run: npx playwright test
