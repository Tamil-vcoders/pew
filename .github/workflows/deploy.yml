name: deploy
on: { push: { branches: [main] } }
permissions: { contents: read, id-token: write }   # WIF
env:
  PROJECT: pew-ideathon
  REGION: asia-south1
  REPO: asia-south1-docker.pkg.dev/pew-ideathon/pew
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: deployer@pew-ideathon.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev -q

      - name: Build and push api
        run: |
          docker build -t $REPO/api:${{ github.sha }} api/
          docker push $REPO/api:${{ github.sha }}
      - name: Deploy api
        run: |
          gcloud run deploy pew-api --image $REPO/api:${{ github.sha }} \
            --region $REGION --allow-unauthenticated \
            --memory 1Gi --timeout 900 --concurrency 40 \
            --set-secrets GEMINI_API_KEY=gemini-api-key:latest \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT,TASKS_QUEUE=cycle-iterations,CORS_ORIGINS=${{ vars.WEB_URL }},TASKS_MODE=cloudtasks,TASKS_LOCATION=asia-south1,INTERNAL_INVOKER_SA=tasks-invoker@pew-ideathon.iam.gserviceaccount.com,API_PUBLIC_URL=${{ vars.API_URL }}"
          # NOTE: requires the WEB_URL repository variable (Settings > Secrets and variables >
          # Actions > Variables) to be set by a human before CORS_ORIGINS takes effect. Until
          # then vars.WEB_URL is empty, so this deploys CORS_ORIGINS= (empty) — api/app/config.py's
          # Settings.cors_origin_list splits on "," and filters out blank entries, so an empty
          # string resolves to [] (no allowed origins), not "allow all" — meaning the web app's
          # requests will keep failing CORS until WEB_URL is set.
          # TASKS_MODE=cloudtasks (Phase 5): switches iteration execution from the in-process
          # dev adapter to Cloud Tasks. API_PUBLIC_URL is also the OIDC audience
          # deps.py::verify_internal_oidc checks on inbound POST /internal/iterations calls, so
          # it must exactly match this service's own URL — reuses the API_URL repository
          # variable already set for the web build's NEXT_PUBLIC_API_URL below.

      - name: Build and push web
        run: |
          docker build -t $REPO/web:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.API_URL }} \
            --build-arg NEXT_PUBLIC_FIREBASE_CONFIG='${{ vars.FIREBASE_WEB_CONFIG }}' web/
          docker push $REPO/web:${{ github.sha }}
      - name: Deploy web
        run: |
          gcloud run deploy pew-web --image $REPO/web:${{ github.sha }} \
            --region $REGION --allow-unauthenticated --memory 512Mi

      - name: Deploy Firestore rules and indexes
        run: |
          npm i -g firebase-tools
          firebase deploy --only firestore:rules,firestore:indexes --project $PROJECT
